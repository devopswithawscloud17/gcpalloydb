name: AlloyDB DR Terraform Reconciliation
on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [qa, prod]
permissions: { contents: read, id-token: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-dr
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.12.2" }
      - run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="prefix=alloydb/${{ inputs.environment }}"
      - run: terraform apply -refresh-only -auto-approve -var-file="environments/${{ inputs.environment }}.tfvars"
      - run: terraform plan -var-file="environments/${{ inputs.environment }}.tfvars"
